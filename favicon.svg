<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="ruler" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- App-bricka med mjukt rundade hörn -->
  <rect width="64" height="64" rx="16" fill="url(#bg)" />

  <!-- Geometrisk Vinkelhake / Triangellinjal med skuggning -->
  <g filter="url(#shadow)">
    <!-- Yttre triangel -->
    <path d="M 14 14 L 50 50 L 14 50 Z" fill="url(#ruler)" />

    <!-- Inre utskärning (vinkelhakens hål) -->
    <path d="M 22 28 L 38 44 L 22 44 Z" fill="url(#bg)" />

    <!-- Rät vinkel-markering nere till vänster -->
    <path d="M 14 43 L 21 43 L 21 50" fill="none" stroke="#4f46e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Graderingsstreck längs botten och vertikala sidan -->
    <line x1="28" y1="50" x2="28" y2="47" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
    <line x1="34" y1="50" x2="34" y2="46" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
    <line x1="40" y1="50" x2="40" y2="47" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
    <line x1="14" y1="36" x2="17" y2="36" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
    <line x1="14" y1="30" x2="18" y2="30" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
    <line x1="14" y1="24" x2="17" y2="24" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Liten gyllene stjärna / märke i övre högra hörnet -->
  <circle cx="49" cy="15" r="9" fill="#f59e0b" filter="url(#shadow)" />
  <path d="M 49 10 L 50.4 13.5 L 54 13.8 L 51.3 16.2 L 52.1 19.8 L 49 17.8 L 45.9 19.8 L 46.7 16.2 L 44 13.8 L 47.6 13.5 Z" fill="#ffffff" />
</svg>

